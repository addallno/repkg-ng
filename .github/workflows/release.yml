name: Build & Release

on:
  push:
    tags:
      - 'alpha*'
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            ext: .exe
          - rid: linux-x64
            os: ubuntu-latest
            ext: ''
          - rid: linux-arm64
            os: ubuntu-latest
            ext: ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Publish net8.0 ${{ matrix.rid }}
        run: |
          dotnet publish RePKG/RePKG.csproj \
            -c Release \
            -f net8.0 \
            -r ${{ matrix.rid }} \
            --self-contained \
            -o ./publish

      - name: Prepare archive
        run: |
          cd publish
          mv RePKG${{ matrix.ext }} repkg-${{ matrix.rid }}${{ matrix.ext }}
          rm -f *.pdb *.config
          cd ..
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a repkg-${{ matrix.rid }}.zip ./publish/*
          else
            tar czf repkg-${{ matrix.rid }}.tar.gz -C publish .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: repkg-${{ matrix.rid }}
          path: repkg-${{ matrix.rid }}.*

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            repkg-win-x64.*
            repkg-linux-x64.*
            repkg-linux-arm64.*
          generate_release_notes: true
