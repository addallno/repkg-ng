name: Build

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish single file
      run: |
        dotnet publish RePKG/RePKG.csproj -c Release -r linux-${{ matrix.arch }} -f net8.0 --self-contained -p:PublishSingleFile=true -o artifacts/${{ matrix.arch }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: repkg-${{ matrix.arch }}
        path: artifacts/${{ matrix.arch }}/RePKG
